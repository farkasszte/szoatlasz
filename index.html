    <script>
      // A mentett téma már az első festés előtt érvényesül (alapból sötét).
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("szoatlasz:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
